name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore QuickMacro.sln

      - name: Build
        run: dotnet build QuickMacro.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test QuickMacro.sln --configuration Release --no-build

      - name: Publish self-contained WinUI 3 x64 app
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/QuickMacro.WinUI/QuickMacro.WinUI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            "-p:Version=$version" `
            "-p:InformationalVersion=$version" `
            --output artifacts/release

      - name: Create ZIP containing the complete app
        shell: pwsh
        run: Compress-Archive -Path artifacts/release/* -DestinationPath "artifacts/QuickMacro-${{ github.ref_name }}-win-x64.zip" -Force

      - name: Create GitHub release and attach executable
        uses: softprops/action-gh-release@v2
        with:
          name: QuickMacro ${{ github.ref_name }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          files: artifacts/QuickMacro-${{ github.ref_name }}-win-x64.zip
