name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore QuickMacro.sln

      - name: Build
        run: dotnet build QuickMacro.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test QuickMacro.sln --configuration Release --no-build

      - name: Publish self-contained x64 executable
        shell: pwsh
        run: >-
          dotnet publish src/QuickMacro/QuickMacro.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts/release

      - name: Name release asset
        shell: pwsh
        run: Copy-Item artifacts/release/QuickMacro.exe "artifacts/QuickMacro-${{ github.ref_name }}-win-x64.exe"

      - name: Create GitHub release and attach executable
        uses: softprops/action-gh-release@v2
        with:
          name: QuickMacro ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/QuickMacro-${{ github.ref_name }}-win-x64.exe
